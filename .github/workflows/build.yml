name: Build DrumBurp
on: push

permissions:
  contents: write

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────
  build_linux:
    name: Linux Build
    runs-on: ubuntu-latest
    # Run on any push except direct pushes to master (tags are not branches,
    # so tag pushes always pass this condition and trigger the release job).
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Qt/audio deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libegl1 \
            qttools5-dev-tools

      - name: Install pip modules
        run: pip install -r build/requirements-linux.txt

      - name: Compile translations
        run: |
          lrelease src/i18n/drumburp_en.ts -qm src/i18n/drumburp_en.qm
          lrelease src/i18n/drumburp_es.ts -qm src/i18n/drumburp_es.qm

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s src/test

      - name: Build
        run: bash build/build_linux.sh

      - name: Store Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: db_linux
          path: "build/dist/DrumBurp"
          retention-days: 7

  test_linux:
    needs: build_linux
    name: Linux Smoke Test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Get Linux binary
        uses: actions/download-artifact@v4
        with:
          name: db_linux

      - name: Test Linux binary
        run: |
          chmod 770 db_linux/DrumBurp
          db_linux/DrumBurp --pyinstaller-test

  # ── Windows ──────────────────────────────────────────────────────────────
  build_windows:
    name: Windows Build
    runs-on: windows-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $env:GITHUB_ENV

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: MSVC 2008 redistributable
        run: choco install vcredist2008

      - name: Install NSIS
        run: choco install nsis

      - name: Install pip modules
        run: pip install -r build/requirements-windows.txt

      - name: Add Qt translation tools to PATH
        run: |
          $qtBins = @(
            python -c "import pathlib, PyQt5; print(pathlib.Path(PyQt5.__file__).parent / 'Qt5' / 'bin')" 2>$null
            python -c "import importlib.util, pathlib; spec = importlib.util.find_spec('qt5_applications'); print(pathlib.Path(next(iter(spec.submodule_search_locations))) / 'Qt' / 'bin' if spec and spec.submodule_search_locations else '')" 2>$null
          )
          foreach ($qtBin in $qtBins) {
            if ($qtBin -and (Test-Path "$qtBin")) {
              "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$qtBin;$env:PATH"
            }
          }
          lrelease -version

      - name: Compile translations
        run: |
          lrelease src\i18n\drumburp_en.ts -qm src\i18n\drumburp_en.qm
          lrelease src\i18n\drumburp_es.ts -qm src\i18n\drumburp_es.qm

      - name: Build
        run: .\build\build_windows.ps1

      - name: Store Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: db_windows
          path: "build/output/DrumBurp-${{ env.DB_VERSION }}.0-setup.exe"
          retention-days: 7

  test_windows:
    needs: build_windows
    name: Windows Smoke Test
    runs-on: windows-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $env:GITHUB_ENV

      - name: Get installer
        uses: actions/download-artifact@v4
        with:
          name: db_windows

      - name: Install Windows exe
        run: .\db_windows\DrumBurp-${{ env.DB_VERSION }}.0-setup.exe /S /D=%GITHUB_WORKSPACE%\installed
        shell: cmd

      - name: Test Windows exe
        run: cd %GITHUB_WORKSPACE%\installed\DrumBurp\ && .\DrumBurp.exe --pyinstaller-test
        shell: cmd

  # ── macOS ───────────────────────────────────────────────────────────────
  build_macos:
    name: macOS Build
    runs-on: macos-15-intel
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install Qt translation tools
        run: |
          brew install qt
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Install pip modules
        run: pip install -r build/requirements-macos.txt

      - name: Compile translations
        run: |
          lrelease src/i18n/drumburp_en.ts -qm src/i18n/drumburp_en.qm
          lrelease src/i18n/drumburp_es.ts -qm src/i18n/drumburp_es.qm

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s src/test

      - name: Build
        run: bash build/build_macos.sh

      - name: Store macOS app
        uses: actions/upload-artifact@v4
        with:
          name: db_macos
          path: "build/output/DrumBurp-${{ env.DB_VERSION }}-macOS-x64.zip"
          retention-days: 7

  test_macos:
    needs: build_macos
    name: macOS Smoke Test
    runs-on: macos-15-intel
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Get macOS app
        uses: actions/download-artifact@v4
        with:
          name: db_macos
          path: db_macos

      - name: Test macOS app
        run: |
          unzip -q "db_macos/DrumBurp-${{ env.DB_VERSION }}-macOS-x64.zip" -d macos_app
          "macos_app/DrumBurp.app/Contents/MacOS/DrumBurp" --pyinstaller-test

  # ── Release (only on version tags: v1.1.3, v2.0.0, etc.) ────────────────
  release:
    needs: [test_windows, test_linux, test_macos]
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Get version number
        run: echo "DB_VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_ENV

      # Download the artifacts produced by the build jobs above.
      # They are available because build/test jobs ran first (via needs:).
      - name: Get Windows installer
        uses: actions/download-artifact@v4
        with:
          name: db_windows
          path: db_windows

      - name: Get Linux binary
        uses: actions/download-artifact@v4
        with:
          name: db_linux
          path: db_linux

      - name: Get macOS app
        uses: actions/download-artifact@v4
        with:
          name: db_macos
          path: db_macos

      # softprops/action-gh-release is the maintained replacement for the
      # deprecated actions/create-release + actions/upload-release-asset combo.
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "DrumBurp ${{ env.DB_VERSION }}"
          draft: false
          prerelease: false
          files: |
            db_windows/DrumBurp-${{ env.DB_VERSION }}.0-setup.exe
            db_linux/DrumBurp
            db_macos/DrumBurp-${{ env.DB_VERSION }}-macOS-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
