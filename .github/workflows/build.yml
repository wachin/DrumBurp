name: Build DrumBurp
on: push

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────
  build_linux:
    name: Linux Build
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Qt/audio deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            python3-pyqt5 \
            python3-pyqt5.qtmultimedia \
            libqt5multimedia5-plugins \
            libegl1

      - name: Install pip modules
        run: pip install -r build/requirements-linux.txt

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s src/test

      - name: Build
        run: bash build/build_linux.sh

      - name: Store Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: db_linux
          path: "build/dist/DrumBurp"

  test_linux:
    needs: build_linux
    name: Linux Smoke Test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Get Linux binary
        uses: actions/download-artifact@v4
        with:
          name: db_linux

      - name: Test Linux binary
        run: |
          ls db_linux
          chmod 770 db_linux/DrumBurp
          db_linux/DrumBurp --pyinstaller-test

  # ── Windows ──────────────────────────────────────────────────────────────
  build_windows:
    name: Windows Build
    runs-on: windows-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $env:GITHUB_ENV

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: MSVC 2008 redistributable
        run: choco install vcredist2008

      - name: Install pip modules
        run: pip install -r build/requirements-windows.txt

      - name: Build
        run: build/build_windows.ps1

      - name: Store Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: db_windows
          path: "build/output/DrumBurp-${{ env.DB_VERSION }}.0-setup.exe"

  test_windows:
    needs: build_windows
    name: Windows Smoke Test
    runs-on: windows-latest
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $env:GITHUB_ENV

      - name: Get installer
        uses: actions/download-artifact@v4
        with:
          name: db_windows

      - name: Install Windows exe
        run: .\db_windows\DrumBurp-${{ env.DB_VERSION }}.0-setup.exe /S /D=%GITHUB_WORKSPACE%\installed
        shell: cmd

      - name: Test Windows exe
        run: cd %GITHUB_WORKSPACE%\installed\DrumBurp\ && .\DrumBurp.exe --pyinstaller-test
        shell: cmd

  # ── Release ──────────────────────────────────────────────────────────────
  release:
    needs: [test_windows, test_linux]
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version number
        run: echo "DB_VERSION=$(cat VERSION)" >> $GITHUB_ENV

      - name: Create Release
        id: this-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Get Windows installer
        uses: actions/download-artifact@v4
        with:
          name: db_windows

      - name: Release Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.this-release.outputs.upload_url }}
          asset_path: "db_windows/DrumBurp-${{ env.DB_VERSION }}.0-setup.exe"
          asset_name: "DrumBurp-${{ env.DB_VERSION }}-Windows-setup.exe"
          asset_content_type: application/octet-stream

      - name: Get Linux binary
        uses: actions/download-artifact@v4
        with:
          name: db_linux

      - name: Release Linux
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.this-release.outputs.upload_url }}
          asset_path: db_linux/DrumBurp
          asset_name: DrumBurp-${{ env.DB_VERSION }}-Linux-x64
          asset_content_type: application/octet-stream
